openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Public cryptocurrency market data
  - name: news
    description: Recent headlines from public crypto and Web3 publication feeds
  - name: blockchain
    description: Public latest-block and network status snapshots
  - name: wallet
    description: Read-only public wallet balance and watch operations
  - name: intelligence
    description: AI-assisted market research
  - name: auth
    description: Authenticated account and role information
paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user's application account
      description: Creates the user's local application record on first access and returns its role and account status.
      responses:
        "200":
          description: Current application account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The application account could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/overview:
    get:
      operationId: getMarketOverview
      tags: [market]
      summary: Get global cryptocurrency market metrics
      responses:
        "200":
          description: Market overview from the configured public data provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"
        "503":
          description: Market data provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /market/coins:
    get:
      operationId: getMarketCoins
      tags: [market]
      summary: List the top cryptocurrencies by market capitalization
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Coins with provider timestamps and source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCoinsResponse"
        "503":
          description: Market data provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /market/history:
    get:
      operationId: getMarketHistory
      tags: [market]
      summary: Get historical price points for a cryptocurrency
      parameters:
        - name: coinId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: days
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "7", "30", "90", "365", "max"]
            default: "7"
      responses:
        "200":
          description: Historical prices with source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketHistoryResponse"
        "503":
          description: Market data provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /news/latest:
    get:
      operationId: getLatestNews
      tags: [news]
      summary: Get recent cryptocurrency and Web3 headlines
      description: Returns recent items and per-feed availability from public RSS sources. Headlines are not investment advice.
      responses:
        "200":
          description: Recent headlines with publication and provider metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeedResponse"
  /blockchain/status:
    get:
      operationId: getBlockchainStatus
      tags: [blockchain]
      summary: Get the latest public network status snapshots
      description: Reads current public block heights, Solana slot, and EVM gas estimates. Providers may be rate-limited.
      responses:
        "200":
          description: Per-network provider status and latest reported data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockchainStatusResponse"
  /wallet/scan:
    post:
      operationId: scanWallet
      tags: [wallet]
      summary: Read public native-token balance for a wallet
      description: Read-only lookup. Never accepts or requests private keys, seed phrases, signatures, or transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletScanInput"
      responses:
        "200":
          description: Address validation and read-only wallet scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletScanResult"
  /watch/wallets:
    get:
      operationId: listWalletWatches
      tags: [wallet]
      summary: List the signed-in user's watched wallets
      responses:
        "200":
          description: Wallet watches owned by the current account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletWatch"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWalletWatch
      tags: [wallet]
      summary: Add a public address to the signed-in user's watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletWatchInput"
      responses:
        "201":
          description: Wallet watch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletWatch"
        "400":
          description: Address or network is invalid or unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteWalletWatch
      tags: [wallet]
      summary: Remove a wallet from the signed-in user's watchlist
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Wallet watch removed
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /watch/wallets/{watchId}:
    patch:
      operationId: updateWalletWatch
      tags: [wallet]
      summary: Update the label or alert setting for an owned wallet watch
      parameters:
        - name: watchId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletWatchUpdate"
      responses:
        "200":
          description: Updated wallet watch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletWatch"
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /watch/activity:
    get:
      operationId: getWalletWatchActivity
      tags: [wallet]
      summary: Refresh and list recent public transfer activity for a watched wallet
      description: Public RPC mode tracks ERC-20, ERC-721, and ERC-1155 transfer logs on Ethereum, Polygon, Avalanche, Base, and Arbitrum, plus recent Solana token/native balance changes. Paired token movements can be labeled as possible trades, but this is not a protocol-confirmed buy/sell classification. Staking and complete historical activity are not reliably identified.
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent tracked activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletWatchActivityResponse"
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [auth]
      summary: List application accounts for administrators
      responses:
        "200":
          description: User accounts and counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/wallets:
    get:
      operationId: listAdminWalletWatches
      tags: [auth]
      summary: List wallet watches across all accounts
      responses:
        "200":
          description: Watched public addresses and their account owners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWalletWatch"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAdminWalletWatch
      tags: [auth]
      summary: Add a public wallet watch to an application account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWalletWatchInput"
      responses:
        "201":
          description: Wallet watch created for the selected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletWatch"
        "400":
          description: Address, network, label, or account is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This address is already watched by that account on this network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminWalletWatch
      tags: [auth]
      summary: Update an account wallet watch label or alert setting
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWalletWatchUpdate"
      responses:
        "200":
          description: Updated wallet watch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletWatch"
        "400":
          description: Invalid wallet watch update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminWalletWatch
      tags: [auth]
      summary: Remove a wallet watch from any account
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Wallet watch removed
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/providers:
    get:
      operationId: getAdminProviderStatus
      tags: [auth]
      summary: Check whether required server-side providers are configured
      description: Returns configuration status only. Secret values are never returned or changed through the application.
      responses:
        "200":
          description: Safe provider configuration status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProviderStatus"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/activity:
    get:
      operationId: listAdminActivity
      tags: [auth]
      summary: List recent saved public wallet activity across accounts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent saved activity and its watched wallet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWalletActivity"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminActivity
      tags: [auth]
      summary: Remove one saved observation from the application database
      parameters:
        - name: activityId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Saved observation removed; the on-chain transaction is unaffected
        "404":
          description: Saved observation was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{clerkUserId}:
    patch:
      operationId: updateAdminUser
      tags: [auth]
      summary: Update an application's user role or status
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid network or address format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Network data provider is unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletScanResult"
  /intelligence/ask:
    post:
      operationId: askIntelligence
      tags: [intelligence]
      summary: Ask a market question using current public market data
      description: Answers are grounded in a fresh public market snapshot; wallet histories and unconnected blockchain feeds are not available to the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "200":
          description: Market analysis with scope and source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionResponse"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI or market data provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CurrentUser:
      type: object
      properties:
        clerkUserId:
          type: string
        role:
          type: string
          enum: [user, admin, investigator]
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [clerkUserId, role, status, createdAt, updatedAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    MarketOverview:
      type: object
      properties:
        totalMarketCapUsd:
          type: number
        totalVolume24hUsd:
          type: number
        bitcoinDominancePercent:
          type: number
        activeCryptocurrencies:
          type: integer
        marketCapChange24hPercent:
          type: number
        updatedAt:
          type: string
          format: date-time
        source:
          type: string
      required:
        - totalMarketCapUsd
        - totalVolume24hUsd
        - bitcoinDominancePercent
        - activeCryptocurrencies
        - marketCapChange24hPercent
        - updatedAt
        - source
    MarketCoin:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        name:
          type: string
        image:
          type: string
        currentPriceUsd:
          type: number
        marketCapUsd:
          type: number
        marketCapRank:
          type: integer
        volume24hUsd:
          type: number
        change24hPercent:
          type: number
        sparkline7d:
          type: array
          items:
            type: number
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - symbol
        - name
        - image
        - currentPriceUsd
        - marketCapUsd
        - marketCapRank
        - volume24hUsd
        - change24hPercent
        - sparkline7d
        - updatedAt
    MarketCoinsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketCoin"
        updatedAt:
          type: string
          format: date-time
        source:
          type: string
      required: [items, updatedAt, source]
    MarketHistoryPoint:
      type: object
      properties:
        timestamp:
          type: integer
        priceUsd:
          type: number
      required: [timestamp, priceUsd]
    MarketHistoryResponse:
      type: object
      properties:
        coinId:
          type: string
        days:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/MarketHistoryPoint"
        updatedAt:
          type: string
          format: date-time
        source:
          type: string
      required: [coinId, days, points, updatedAt, source]
    NewsArticle:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        source:
          type: string
        publishedAt:
          type: ["string", "null"]
          format: date-time
        summary:
          type: string
      required: [title, url, source, publishedAt, summary]
    NewsProviderStatus:
      type: object
      properties:
        provider:
          type: string
        status:
          type: string
          enum: [available, unavailable]
        articleCount:
          type: integer
      required: [provider, status, articleCount]
    NewsFeedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/NewsProviderStatus"
        updatedAt:
          type: string
          format: date-time
        source:
          type: string
      required: [items, providers, updatedAt, source]
    BlockchainNetworkStatus:
      type: object
      properties:
        network:
          type: string
          enum: [bitcoin, ethereum, polygon, avalanche, base, arbitrum, solana]
        name:
          type: string
        family:
          type: string
          enum: [bitcoin, evm, solana]
        status:
          type: string
          enum: [available, unavailable]
        latestHeight:
          type: ["string", "null"]
        blockTime:
          type: ["string", "null"]
          format: date-time
        gasPriceGwei:
          type: ["number", "null"]
        epoch:
          type: ["string", "null"]
        source:
          type: string
        checkedAt:
          type: string
          format: date-time
        error:
          type: ["string", "null"]
      required: [network, name, family, status, latestHeight, blockTime, gasPriceGwei, epoch, source, checkedAt, error]
    BlockchainStatusResponse:
      type: object
      properties:
        networks:
          type: array
          items:
            $ref: "#/components/schemas/BlockchainNetworkStatus"
        updatedAt:
          type: string
          format: date-time
        source:
          type: string
      required: [networks, updatedAt, source]
    WalletNetwork:
      type: string
      enum: [bitcoin, ethereum, solana, polygon, tron, avalanche, ton, sui]
    WalletScanInput:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/WalletNetwork"
        address:
          type: string
          minLength: 1
          maxLength: 128
      required: [network, address]
    WalletScanResult:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/WalletNetwork"
        address:
          type: string
        status:
          type: string
          enum: [ok, invalid, unsupported, unavailable]
        nativeAsset:
          type: ["string", "null"]
        nativeBalance:
          type: ["string", "null"]
        explorerUrl:
          type: string
        source:
          type: ["string", "null"]
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        - network
        - address
        - status
        - nativeAsset
        - nativeBalance
        - explorerUrl
        - source
        - checkedAt
        - message
    WalletWatchNetwork:
      type: string
      enum: [ethereum, polygon, avalanche, base, arbitrum, solana]
    WalletWatchInput:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/WalletWatchNetwork"
        address:
          type: string
          minLength: 1
          maxLength: 128
        label:
          type: string
          minLength: 1
          maxLength: 80
        alertsEnabled:
          type: boolean
      required: [network, address, label]
    WalletWatchUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        alertsEnabled:
          type: boolean
      minProperties: 1
    WalletWatch:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        network:
          $ref: "#/components/schemas/WalletWatchNetwork"
        address:
          type: string
        label:
          type: string
        alertsEnabled:
          type: boolean
        lastCheckedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, clerkUserId, network, address, label, alertsEnabled, lastCheckedAt, createdAt]
    WalletWatchActivity:
      type: object
      properties:
        id:
          type: integer
        txHash:
          type: string
        activityType:
          type: string
          enum: [token_transfer, native_transfer, nft_transfer]
        direction:
          type: string
          enum: [in, out, change]
        asset:
          type: string
        amount:
          type: string
        counterparty:
          type: ["string", "null"]
        blockNumber:
          type: ["string", "null"]
        occurredAt:
          type: ["string", "null"]
          format: date-time
        explorerUrl:
          type: string
      required: [id, txHash, activityType, direction, asset, amount, counterparty, blockNumber, occurredAt, explorerUrl]
    WalletWatchActivityResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WalletWatchActivity"
        checkedAt:
          type: string
          format: date-time
        source:
          type: string
        notice:
          type: string
      required: [items, checkedAt, source, notice]
    AdminUser:
      type: object
      properties:
        clerkUserId:
          type: string
        role:
          type: string
          enum: [user, admin, investigator]
        status:
          type: string
          enum: [active, suspended]
        trackedWalletCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [clerkUserId, role, status, trackedWalletCount, createdAt]
    AdminUserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin, investigator]
        status:
          type: string
          enum: [active, suspended]
      minProperties: 1
    AdminWalletWatch:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        network:
          $ref: "#/components/schemas/WalletWatchNetwork"
        address:
          type: string
        label:
          type: string
        alertsEnabled:
          type: boolean
        lastCheckedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, clerkUserId, network, address, label, alertsEnabled, lastCheckedAt, createdAt]
    AdminWalletWatchInput:
      type: object
      properties:
        clerkUserId:
          type: string
          minLength: 1
          maxLength: 160
        network:
          $ref: "#/components/schemas/WalletWatchNetwork"
        address:
          type: string
          minLength: 1
          maxLength: 128
        label:
          type: string
          minLength: 1
          maxLength: 80
        alertsEnabled:
          type: boolean
      required: [clerkUserId, network, address, label, alertsEnabled]
    AdminWalletWatchUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        alertsEnabled:
          type: boolean
      minProperties: 1
