openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Public cryptocurrency market data
  - name: news
    description: Recent headlines from public crypto and Web3 publication feeds
  - name: blockchain
    description: Public latest-block and network status snapshots
  - name: wallet
    description: Read-only public wallet balance and watch operations
  - name: intelligence
    description: AI-assisted market research
  - name: auth
    description: Authenticated account and role information
  - name: wallet-auth
    description: EVM wallet authentication using EIP-4361 signed messages
paths:
  /wallet-auth/challenge:
    post:
      operationId: createWalletAuthChallenge
      tags: [wallet-auth]
      summary: Create a one-time wallet sign-in message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletAuthChallengeInput"
      responses:
        "200":
          description: EIP-4361 message to sign with an EVM wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletAuthChallenge"
        "400":
          description: Invalid wallet address or chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many wallet authentication attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /wallet-auth/verify:
    post:
      operationId: verifyWalletAuth
      tags: [wallet-auth]
      summary: Verify a wallet signature and start a wallet session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletAuthVerifyInput"
      responses:
        "200":
          description: Wallet session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletAuthVerifyResponse"
        "400":
          description: Invalid or expired wallet signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Wallet authentication or account storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /wallet-auth/session:
    get:
      operationId: getWalletAuthSession
      tags: [wallet-auth]
      summary: Check the current browser wallet session
      responses:
        "200":
          description: Wallet session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletAuthSession"
  /wallet-auth/logout:
    post:
      operationId: logoutWalletAuth
      tags: [wallet-auth]
      summary: End the current wallet session
      responses:
        "200":
          description: Wallet session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletAuthLogoutResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user's application account
      description: Creates the user's local application record on first access and returns its role and account status.
      responses:
        "200":
          description: Current application account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The application account could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/overview:
    get:
      operationId: getMarketOverview
      tags: [market]
      summary: Get global cryptocurrency market metrics
      responses:
        "200":
          description: Market overview from the configured public data provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"
        "503":
          description: Market data provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /market/coins:
    get:
      operationId: getMarketCoins
      tags: [market]
      summary: List the top cryptocurrencies by market capitalization
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Coins with provider timestamps and source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCoinsResponse"
        "503":
          description: Market data provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /market/history:
    get:
      operationId: getMarketHistory
      tags: [market]
      summary: Get historical price points for a cryptocurrency
      parameters:
        - name: coinId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: days
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "7", "30", "90", "365", "max"]
            default: "7"
      responses:
        "200":
          description: Historical prices with source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketHistoryResponse"
        "503":
          description: Market data provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /news/latest:
    get:
      operationId: getLatestNews
      tags: [news]
      summary: Get recent cryptocurrency and Web3 headlines
      description: Returns recent items and per-feed availability from public RSS sources. Headlines are not investment advice.
      responses:
        "200":
          description: Recent headlines with publication and provider metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeedResponse"
  /blockchain/status:
    get:
      operationId: getBlockchainStatus
      tags: [blockchain]
      summary: Get the latest public network status snapshots
      description: Reads current public block heights, Solana slot, and EVM gas estimates. Providers may be rate-limited.
      responses:
        "200":
          description: Per-network provider status and latest reported data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockchainStatusResponse"
  /wallet/scan:
    post:
      operationId: scanWallet
      tags: [wallet]
      summary: Read public native-token balance for a wallet
      description: Read-only lookup. Never accepts or requests private keys, seed phrases, signatures, or transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletScanInput"
      responses:
        "200":
          description: Address validation and read-only wallet scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletScanResult"
  /watch/wallets:
    get:
      operationId: listWalletWatches
      tags: [wallet]
      summary: List the signed-in user's watched wallets
      responses:
        "200":
          description: Wallet watches owned by the current account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletWatch"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWalletWatch
      tags: [wallet]
      summary: Add a public address to the signed-in user's watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletWatchInput"
      responses:
        "201":
          description: Wallet watch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletWatch"
        "400":
          description: Address or network is invalid or unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteWalletWatch
      tags: [wallet]
      summary: Remove a wallet from the signed-in user's watchlist
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Wallet watch removed
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /watch/wallets/{watchId}:
    patch:
      operationId: updateWalletWatch
      tags: [wallet]
      summary: Update the label or alert setting for an owned wallet watch
      parameters:
        - name: watchId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletWatchUpdate"
      responses:
        "200":
          description: Updated wallet watch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletWatch"
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /watch/activity:
    get:
      operationId: getWalletWatchActivity
      tags: [wallet]
      summary: Refresh and list recent public transfer activity for a watched wallet
      description: Public RPC mode tracks ERC-20, ERC-721, and ERC-1155 transfer logs on Ethereum, Polygon, Avalanche, Base, and Arbitrum, plus recent Solana token/native balance changes. Paired token movements can be labeled as possible trades, but this is not a protocol-confirmed buy/sell classification. Staking and complete historical activity are not reliably identified.
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent tracked activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletWatchActivityResponse"
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [auth]
      summary: List application accounts for administrators
      responses:
        "200":
          description: User accounts and counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/wallets:
    get:
      operationId: listAdminWalletWatches
      tags: [auth]
      summary: List wallet watches across all accounts
      responses:
        "200":
          description: Watched public addresses and their account owners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWalletWatch"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAdminWalletWatch
      tags: [auth]
      summary: Add a public wallet watch to an application account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWalletWatchInput"
      responses:
        "201":
          description: Wallet watch created for the selected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletWatch"
        "400":
          description: Address, network, label, or account is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This address is already watched by that account on this network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminWalletWatch
      tags: [auth]
      summary: Update an account wallet watch label or alert setting
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWalletWatchUpdate"
      responses:
        "200":
          description: Updated wallet watch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletWatch"
        "400":
          description: Invalid wallet watch update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminWalletWatch
      tags: [auth]
      summary: Remove a wallet watch from any account
      parameters:
        - name: watchId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Wallet watch removed
        "404":
          description: Wallet watch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/providers:
    get:
      operationId: getAdminProviderStatus
      tags: [auth]
      summary: Check whether required server-side providers are configured
      description: Returns configuration status only. Secret values are never returned or changed through the application.
      responses:
        "200":
          description: Safe provider configuration status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProviderStatus"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/activity:
    get:
      operationId: listAdminActivity
      tags: [auth]
      summary: List recent saved public wallet activity across accounts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent saved activity and its watched wallet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWalletActivity"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminActivity
      tags: [auth]
      summary: Remove one saved observation from the application database
      parameters:
        - name: activityId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Saved observation removed; the on-chain transaction is unaffected
        "404":
          description: Saved observation was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{clerkUserId}:
    patch:
      operationId: updateAdminUser
      tags: [auth]
      summary: Update an application's user role or status
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid network or address format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Network data provider is unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletScanResult"
  /intelligence/ask:
    post:
      operationId: askIntelligence
      tags: [intelligence]
      summary: Ask a market question using current public market data
      description: Answers are grounded in a fresh public market snapshot; wallet histories and unconnected blockchain feeds are not available to the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "200":
          description: Market analysis with scope and source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionResponse"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI or market data provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shop/products:
    get:
      operationId: listShopProducts
      tags: [shop]
      summary: List active shop products
      responses:
        "200":
          description: Active products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProduct"
  /shop/products/{slug}:
    get:
      operationId: getShopProduct
      tags: [shop]
      summary: Get an active product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shop/payment-instructions:
    get:
      operationId: getShopPaymentInstructions
      tags: [shop]
      summary: Get public manual crypto payment instructions
      responses:
        "200":
          description: Receiving address and payment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPaymentInstructions"
  /shop/orders:
    get:
      operationId: listMyShopOrders
      tags: [shop]
      summary: List the signed-in user's orders
      responses:
        "200":
          description: Current user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopOrder"
    post:
      operationId: createShopOrder
      tags: [shop]
      summary: Place a direct-sale order for manual crypto payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopOrderInput"
      responses:
        "201":
          description: Order awaiting manual crypto payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "400":
          description: Invalid order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign in to place an order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shop/orders/{id}/payment:
    patch:
      operationId: submitShopPaymentReference
      tags: [shop]
      summary: Submit a transaction reference for manual review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPaymentReferenceInput"
      responses:
        "200":
          description: Payment reference submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "404":
          description: Order not found or not owned by this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/shop/products:
    get:
      operationId: listAdminShopProducts
      tags: [shop]
      summary: List all shop products for administrators
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProduct"
    post:
      operationId: createAdminShopProduct
      tags: [shop]
      summary: Add a shop product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
        "400":
          description: Product details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/shop/products/{id}:
    patch:
      operationId: updateAdminShopProduct
      tags: [shop]
      summary: Update or archive a shop product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/shop/orders:
    get:
      operationId: listAdminShopOrders
      tags: [shop]
      summary: List orders for administrators
      responses:
        "200":
          description: All orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopOrder"
  /admin/shop/orders/{id}:
    patch:
      operationId: updateAdminShopOrder
      tags: [shop]
      summary: Update an order after manual payment and fulfillment review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopOrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/shop/payment-settings:
    get:
      operationId: getAdminShopPaymentSettings
      tags: [shop]
      summary: Get manual crypto receiving settings
      responses:
        "200":
          description: Configured receiving wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPaymentSettings"
    put:
      operationId: updateAdminShopPaymentSettings
      tags: [shop]
      summary: Set the public receiving address and checkout instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPaymentSettingsInput"
      responses:
        "200":
          description: Updated payment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPaymentSettings"
components:
  schemas:
    ShopProduct:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        saleType: { type: string, enum: [direct, affiliate] }
        fulfillment: { type: string, enum: [physical, digital] }
        summary: { type: string }
        description: { type: string }
        specs: { type: string }
        priceCents: { type: ["integer", "null"] }
        priceCurrency: { type: string }
        affiliateUrl: { type: ["string", "null"] }
        status: { type: string, enum: [draft, active, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, slug, title, category, saleType, fulfillment, summary, description, specs, priceCents, priceCurrency, affiliateUrl, status, createdAt, updatedAt]
    ShopProductInput:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 140 }
        category: { type: string, minLength: 2, maxLength: 60 }
        saleType: { type: string, enum: [direct, affiliate] }
        fulfillment: { type: string, enum: [physical, digital] }
        summary: { type: string, minLength: 10, maxLength: 300 }
        description: { type: string, minLength: 20, maxLength: 10000 }
        specs: { type: string, maxLength: 4000 }
